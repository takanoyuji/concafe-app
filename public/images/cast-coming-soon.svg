<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="60%" stop-color="#0d0521"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- Stars layer 1 (small) -->
  <g fill="white" opacity="0.6">
    <circle cx="23" cy="18" r="0.8"/>
    <circle cx="67" cy="35" r="0.6"/>
    <circle cx="112" cy="12" r="0.9"/>
    <circle cx="145" cy="42" r="0.7"/>
    <circle cx="189" cy="8" r="0.8"/>
    <circle cx="234" cy="27" r="0.6"/>
    <circle cx="278" cy="15" r="0.9"/>
    <circle cx="38" cy="58" r="0.7"/>
    <circle cx="85" cy="72" r="0.8"/>
    <circle cx="199" cy="55" r="0.7"/>
    <circle cx="258" cy="48" r="0.9"/>
    <circle cx="14" cy="95" r="0.6"/>
    <circle cx="52" cy="110" r="0.8"/>
    <circle cx="97" cy="130" r="0.7"/>
    <circle cx="176" cy="88" r="0.6"/>
    <circle cx="220" cy="105" r="0.8"/>
    <circle cx="270" cy="82" r="0.7"/>
    <circle cx="285" cy="125" r="0.9"/>
    <circle cx="31" cy="148" r="0.7"/>
    <circle cx="130" cy="155" r="0.6"/>
    <circle cx="248" cy="142" r="0.8"/>
    <circle cx="10" cy="200" r="0.7"/>
    <circle cx="58" cy="215" r="0.6"/>
    <circle cx="290" cy="195" r="0.8"/>
    <circle cx="165" cy="190" r="0.7"/>
    <circle cx="42" cy="270" r="0.6"/>
    <circle cx="95" cy="285" r="0.8"/>
    <circle cx="210" cy="260" r="0.7"/>
    <circle cx="275" cy="278" r="0.6"/>
    <circle cx="18" cy="320" r="0.8"/>
    <circle cx="72" cy="340" r="0.7"/>
    <circle cx="152" cy="315" r="0.6"/>
    <circle cx="240" cy="335" r="0.8"/>
    <circle cx="288" cy="355" r="0.7"/>
    <circle cx="35" cy="370" r="0.6"/>
    <circle cx="120" cy="385" r="0.8"/>
    <circle cx="195" cy="375" r="0.7"/>
    <circle cx="255" cy="390" r="0.6"/>
  </g>

  <!-- Stars layer 2 (medium, brighter) -->
  <g filter="url(#glow)">
    <circle cx="47" cy="30" r="1.2" fill="#e2d9ff" opacity="0.9"/>
    <circle cx="160" cy="22" r="1.4" fill="#fff" opacity="0.95"/>
    <circle cx="252" cy="38" r="1.2" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="78" cy="90" r="1.5" fill="#fff" opacity="0.85"/>
    <circle cx="210" cy="70" r="1.3" fill="#e2d9ff" opacity="0.9"/>
    <circle cx="295" cy="100" r="1.2" fill="#f0e6ff" opacity="0.85"/>
    <circle cx="5" cy="140" r="1.4" fill="#fff" opacity="0.9"/>
    <circle cx="138" cy="105" r="1.2" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="268" cy="160" r="1.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Moon -->
  <circle cx="240" cy="70" r="32" fill="url(#moonGrad)" opacity="0.9" filter="url(#glow)"/>
  <circle cx="252" cy="60" r="28" fill="#0d0521"/>

  <!-- Wolf silhouette (simplified) -->
  <g fill="#1a0a2e" opacity="0.85" transform="translate(105, 160)">
    <!-- Body -->
    <ellipse cx="45" cy="68" rx="38" ry="28"/>
    <!-- Head -->
    <ellipse cx="78" cy="42" rx="22" ry="20"/>
    <!-- Left ear -->
    <polygon points="62,26 56,8 72,22"/>
    <!-- Right ear -->
    <polygon points="88,24 95,6 100,22"/>
    <!-- Tail -->
    <path d="M8,62 Q-15,40 -5,25 Q2,35 12,50Z"/>
    <!-- Leg front -->
    <rect x="60" y="88" width="10" height="20" rx="4"/>
    <rect x="73" y="88" width="10" height="20" rx="4"/>
    <!-- Leg back -->
    <rect x="28" y="88" width="10" height="20" rx="4"/>
    <rect x="40" y="88" width="10" height="20" rx="4"/>
  </g>

  <!-- Wolf outline (glowing purple) -->
  <g fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.5" transform="translate(105, 160)">
    <ellipse cx="45" cy="68" rx="38" ry="28"/>
    <ellipse cx="78" cy="42" rx="22" ry="20"/>
    <polygon points="62,26 56,8 72,22"/>
    <polygon points="88,24 95,6 100,22"/>
  </g>

  <!-- COMING SOON text -->
  <text
    x="150" y="315"
    text-anchor="middle"
    fill="url(#textGrad)"
    font-size="18"
    font-weight="bold"
    font-family="'Arial', sans-serif"
    letter-spacing="4"
    filter="url(#textGlow)"
  >COMING SOON</text>

  <!-- Decorative line -->
  <line x1="50" y1="325" x2="250" y2="325" stroke="url(#textGrad)" stroke-width="0.5" opacity="0.5"/>

  <!-- 星狼 text -->
  <text
    x="150" y="355"
    text-anchor="middle"
    fill="#7c3aed"
    font-size="13"
    font-family="'Arial', sans-serif"
    letter-spacing="6"
    opacity="0.7"
  >星 狼</text>

  <!-- Bottom dots decoration -->
  <g fill="url(#textGrad)" opacity="0.6">
    <circle cx="125" cy="370" r="2"/>
    <circle cx="140" cy="370" r="2"/>
    <circle cx="150" cy="372" r="3"/>
    <circle cx="160" cy="370" r="2"/>
    <circle cx="175" cy="370" r="2"/>
  </g>
</svg>
